name: Refresh data and deploy

on:
  schedule:
    # GitHub often skips hourly schedules on new repos, so ask every 15 min.
    # ~96 runs x 3 calls a day stays inside the free 15,000 credits a month.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull live CoinMarketCap data
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: python build.py
      - name: Publish API evidence with the site
        run: mkdir -p site/evidence && cp evidence/*.json site/evidence/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes can't find the Pages artifact on the first try. Wait and retry.
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
